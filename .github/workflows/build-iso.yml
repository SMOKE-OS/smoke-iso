name: Build & Release SMOKE OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1 for v0.1)'
        required: true
        default: '0.1'
        type: string
      timestamp_format:
        description: 'Timestamp format: datetime (YYYYMMDD_HHMM) or date (YYYYMMDD)'
        required: true
        default: 'datetime'
        type: choice
        options:
          - 'datetime'
          - 'date'
      create_release:
        description: 'Publish as a GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-iso:
    name: Build SMOKE OS Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Host Runner
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          echo "Freed disk space:"
          df -h

      - name: Set Release Metadata & ISO Naming
        id: meta
        run: |
          # 1. Determine Version tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            if [[ "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+.* ]]; then
              CLEAN_VER=$(echo "$RAW_TAG" | sed -E 's/^v//; s/BETA$//i')
              VERSION="v${CLEAN_VER}"
            else
              VERSION="${RAW_TAG}"
            fi
            RELEASE_TAG="${RAW_TAG}"
          else
            CLEAN_INPUT=$(echo "${{ inputs.version }}" | sed -E 's/^v//; s/BETA$//i')
            VERSION="v${CLEAN_INPUT}"
            RELEASE_TAG="${VERSION}"
          fi

          # 2. Determine Timestamp for the ISO filename
          if [[ "${{ inputs.timestamp_format }}" == "date" ]]; then
            TIMESTAMP=$(date -u +'%Y%m%d')
          else
            TIMESTAMP=$(date -u +'%Y%m%d_%H%M')
          fi

          # Format: Smoke_os_<timestamp>_v<0.x>.iso
          TARGET_ISO_NAME="Smoke_os_${TIMESTAMP}_${VERSION}.iso"

          echo "target_iso_name=${TARGET_ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Target ISO Name: ${TARGET_ISO_NAME}"
          echo "Version: ${VERSION}"
          echo "Timestamp: ${TIMESTAMP}"
          echo "Release Tag: ${RELEASE_TAG}"

      - name: Build ISO in Privileged Arch Linux Container
        run: |
          mkdir -p out work
          chmod 777 out work

          docker run --rm --privileged \
            --volume "${PWD}:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -c "
              set -ex
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archiso git
              mkarchiso -v -w /workspace/work -o /workspace/out /workspace
            "

      - name: Format ISO Name and Compute Checksum
        id: package
        run: |
          sudo chmod -R 777 out work
          cd out

          ORIGINAL_ISO=$(ls smoke-os-*.iso 2>/dev/null | head -n 1 || true)
          if [ -z "$ORIGINAL_ISO" ]; then
            ORIGINAL_ISO=$(ls *.iso 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$ORIGINAL_ISO" ]; then
            echo "Error: No generated ISO found in out/"
            exit 1
          fi

          TARGET_NAME="${{ steps.meta.outputs.target_iso_name }}"
          echo "Renaming '$ORIGINAL_ISO' to '$TARGET_NAME'"
          mv "$ORIGINAL_ISO" "$TARGET_NAME"

          echo "Generating SHA256 checksum..."
          sha256sum "$TARGET_NAME" > "${TARGET_NAME}.sha256"
          cat "${TARGET_NAME}.sha256"

          echo "iso_path=out/${TARGET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256_path=out/${TARGET_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.target_iso_name }}
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "SMOKE OS ${{ steps.meta.outputs.version }}"
          prerelease: false
          make_latest: true
          draft: false
          files: |
            ${{ steps.package.outputs.iso_path }}
            ${{ steps.package.outputs.sha256_path }}
          body: |
            # 🌫️ SMOKE OS Live Installation Media (${{ steps.meta.outputs.version }})

            Automated beta build of **SMOKE OS** generated with `archiso`.

            ---

            ## 📥 Direct Downloads
            - 💿 [**Download ${{ steps.meta.outputs.target_iso_name }}**](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.target_iso_name }})
            - 🔑 [**Download SHA256 Checksum**](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.target_iso_name }}.sha256)

            ---

            ### 📦 Artifact Details
            - **ISO Image**: `${{ steps.meta.outputs.target_iso_name }}`
            - **Target Architecture**: `x86_64`
            - **Compositor**: Hyprland (Wayland)
            - **Desktop Shell**: Quickshell
            - **Build Timestamp**: `${{ steps.meta.outputs.timestamp }}`

            ### 🔒 Verification
            Verify the integrity of your download before flashing:
            ```bash
            sha256sum -c ${{ steps.meta.outputs.target_iso_name }}.sha256
            ```

            ### 🚀 VM Testing (QEMU)
            ```bash
            qemu-system-x86_64 -enable-kvm -m 4G -smp 2 -cdrom ${{ steps.meta.outputs.target_iso_name }} -vga virtio -display sdl,gl=on
            ```

            > [!WARNING]
            > This is an experimental **BETA** release intended for testing and development.
